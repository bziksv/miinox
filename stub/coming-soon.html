<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="MIINOX — сайт в разработке. Каталог металлопроката скоро откроется." />
  <title>MIINOX — сайт в разработке</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --steel-50: #f3f5f7;
      --steel-200: #cfd6df;
      --steel-500: #6b7785;
      --steel-700: #3d4754;
      --steel-900: #171d24;
      --copper: #b56a2f;
      --copper-soft: #c9844a;
      --ink: #141a21;
      --muted: #5a6572;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background: var(--steel-50);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 4vw, 3rem);
      isolation: isolate;
      overflow: hidden;
      background: linear-gradient(155deg, #f7f8fa 0%, #e9eef3 42%, #d7dee7 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background-image:
        linear-gradient(90deg, rgba(23, 29, 36, 0.06) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 29, 36, 0.06) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 15%, transparent 78%);
      animation: grid-drift 18s linear infinite;
    }

    /* Continuous light sweep — noticeable */
    .sheen {
      position: absolute;
      inset: -30%;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        105deg,
        transparent 35%,
        rgba(255, 255, 255, 0.75) 46%,
        rgba(181, 106, 47, 0.28) 50%,
        rgba(255, 255, 255, 0.65) 54%,
        transparent 65%
      );
      animation: sheen-sweep 4.2s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .plate {
      position: absolute;
      z-index: -2;
      border: 1px solid rgba(61, 71, 84, 0.16);
      background: linear-gradient(145deg, rgba(255,255,255,0.65), rgba(207,214,223,0.4));
      pointer-events: none;
    }
    .plate-a {
      width: min(38vw, 420px);
      height: min(38vw, 420px);
      top: -8%;
      right: -6%;
      animation: plate-float-a 7s ease-in-out infinite;
    }
    .plate-b {
      width: min(28vw, 280px);
      height: min(28vw, 280px);
      bottom: -4%;
      left: -4%;
      animation: plate-float-b 8.5s ease-in-out infinite;
    }

    /* Floating metal sparks */
    .sparks {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }
    .sparks span {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--copper);
      opacity: 0;
      animation: spark-rise 5.5s ease-in-out infinite;
    }
    .sparks span:nth-child(1) { left: 12%; bottom: 8%; animation-delay: 0s; }
    .sparks span:nth-child(2) { left: 28%; bottom: 18%; width: 4px; height: 4px; animation-delay: 1.1s; }
    .sparks span:nth-child(3) { left: 55%; bottom: 10%; animation-delay: 2.2s; }
    .sparks span:nth-child(4) { left: 72%; bottom: 22%; width: 5px; height: 5px; animation-delay: 0.6s; }
    .sparks span:nth-child(5) { left: 88%; bottom: 14%; animation-delay: 3.1s; }
    .sparks span:nth-child(6) { left: 40%; bottom: 6%; width: 3px; height: 3px; animation-delay: 1.8s; }

    .compose {
      width: min(100%, 42rem);
      text-align: center;
      position: relative;
    }

    .brand {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(3.4rem, 14vw, 7.5rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      gap: 0.02em;
    }

    .brand b {
      display: inline-block;
      color: transparent;
      background: linear-gradient(
        100deg,
        #2a333d 0%,
        #2a333d 38%,
        #ffffff 50%,
        #2a333d 62%,
        #171d24 100%
      );
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      animation:
        letter-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both,
        brand-shine 2.8s linear infinite;
    }
    .brand b:nth-child(1) { animation-delay: 0.05s, 0.05s; }
    .brand b:nth-child(2) { animation-delay: 0.12s, 0.12s; }
    .brand b:nth-child(3) { animation-delay: 0.19s, 0.19s; }
    .brand b:nth-child(4) { animation-delay: 0.26s, 0.26s; }
    .brand b:nth-child(5) { animation-delay: 0.33s, 0.33s; }
    .brand b:nth-child(6) { animation-delay: 0.4s, 0.4s; }

    .rule {
      width: min(8rem, 28vw);
      height: 2px;
      margin: 1.35rem auto 1.5rem;
      position: relative;
      background: rgba(61, 71, 84, 0.15);
      overflow: hidden;
      opacity: 0;
      animation: fade-up 0.8s ease 0.5s forwards;
    }
    .rule::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, var(--copper), var(--copper-soft), transparent);
      animation: rule-run 2s ease-in-out infinite;
    }

    .headline {
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: clamp(1.45rem, 3.6vw, 2.05rem);
      letter-spacing: -0.02em;
      color: var(--steel-700);
      opacity: 0;
      animation: fade-up 0.8s ease 0.55s forwards, headline-breathe 3.2s ease-in-out 1.4s infinite;
    }

    .lead {
      margin: 0.85rem auto 0;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      line-height: 1.55;
      color: var(--muted);
      font-weight: 500;
      max-width: 28rem;
      opacity: 0;
      animation: fade-up 0.8s ease 0.7s forwards;
    }

    .cta {
      margin-top: 2.1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      justify-content: center;
      opacity: 0;
      animation: fade-up 0.8s ease 0.85s forwards;
    }

    .cta a {
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1.35rem;
      border-radius: 2px;
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }
    .cta a.primary {
      color: #fff;
      background: var(--steel-900);
      border: 1px solid var(--steel-900);
      animation: cta-pulse 2.6s ease-in-out infinite;
    }
    .cta a.primary:hover {
      background: var(--copper);
      border-color: var(--copper);
      transform: translateY(-2px);
      animation: none;
    }
    .cta a.ghost {
      color: var(--steel-700);
      background: transparent;
      border: 1px solid rgba(61, 71, 84, 0.28);
    }
    .cta a.ghost:hover {
      border-color: var(--copper);
      color: var(--copper);
      transform: translateY(-2px);
    }

    .pulse {
      margin-top: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      opacity: 0;
      animation: fade-up 0.8s ease 1s forwards;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--copper);
      box-shadow: 0 0 0 0 rgba(181, 106, 47, 0.45);
      animation: pulse-ring 1.6s ease-out infinite;
    }
    .pulse-track {
      width: min(14rem, 48vw);
      height: 3px;
      border-radius: 2px;
      background: rgba(61, 71, 84, 0.14);
      overflow: hidden;
      position: relative;
    }
    .pulse-track i {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -45%;
      width: 45%;
      background: linear-gradient(90deg, transparent, var(--copper-soft), var(--copper), var(--copper-soft), transparent);
      animation: pulse-bar 1.8s linear infinite;
    }
    .pulse-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--copper);
      animation: soon-blink 1.6s ease-in-out infinite;
    }

    .foot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: clamp(0.85rem, 2.5vh, 1.5rem);
      text-align: center;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--steel-500);
      opacity: 0;
      animation: fade-up 0.8s ease 1.15s forwards;
      padding: 0 1rem;
    }
    .foot strong {
      font-weight: 600;
      color: var(--steel-700);
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes letter-in {
      from { opacity: 0; transform: translateY(24px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes brand-shine {
      0% { background-position: 120% 0; }
      100% { background-position: -120% 0; }
    }

    @keyframes sheen-sweep {
      0% { transform: translateX(-55%) skewX(-14deg); opacity: 0; }
      18% { opacity: 1; }
      55% { transform: translateX(35%) skewX(-14deg); opacity: 0.95; }
      75%, 100% { transform: translateX(60%) skewX(-14deg); opacity: 0; }
    }

    @keyframes grid-drift {
      from { background-position: 0 0; }
      to { background-position: 64px 64px; }
    }

    @keyframes plate-float-a {
      0%, 100% { transform: rotate(18deg) translateY(0); }
      50% { transform: rotate(20deg) translateY(-22px); }
    }
    @keyframes plate-float-b {
      0%, 100% { transform: rotate(-12deg) translateY(0); }
      50% { transform: rotate(-15deg) translateY(-18px); }
    }

    @keyframes spark-rise {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      15% { opacity: 0.9; }
      70% { opacity: 0.55; }
      100% { transform: translateY(-55vh) scale(1.1); opacity: 0; }
    }

    @keyframes rule-run {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes headline-breathe {
      0%, 100% { letter-spacing: -0.02em; color: var(--steel-700); }
      50% { letter-spacing: 0.01em; color: #2f3944; }
    }

    @keyframes cta-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(23, 29, 36, 0); }
      50% { box-shadow: 0 0 0 10px rgba(181, 106, 47, 0.12); }
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(181, 106, 47, 0.5); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 12px rgba(181, 106, 47, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(181, 106, 47, 0); }
    }

    @keyframes pulse-bar {
      0% { left: -45%; }
      100% { left: 100%; }
    }

    @keyframes soon-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Заглушка — анимация намеренная; prefers-reduced-motion не глушим */

    @media (max-width: 520px) {
      .cta { flex-direction: column; align-items: stretch; }
      .cta a { text-align: center; }
      .plate-a, .plate-b { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="sheen" aria-hidden="true"></div>
    <div class="plate plate-a" aria-hidden="true"></div>
    <div class="plate plate-b" aria-hidden="true"></div>
    <div class="sparks" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="compose">
      <h1 class="brand" aria-label="MIINOX">
        <b>M</b><b>I</b><b>I</b><b>N</b><b>O</b><b>X</b>
      </h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="headline">Сайт в разработке</p>
      <p class="lead">Готовим каталог металлопроката. Скоро здесь откроется полноценный сайт.</p>

      <div class="cta">
        <a class="primary" href="mailto:info@miinox.ru">info@miinox.ru</a>
      </div>

      <div class="pulse" aria-hidden="true">
        <span class="pulse-dot"></span>
        <span class="pulse-track"><i></i></span>
        <span class="pulse-label">скоро</span>
      </div>
    </div>

    <p class="foot">
      <strong>ООО «Металлинвест Инокс»</strong>
    </p>
  </main>
</body>
</html>
